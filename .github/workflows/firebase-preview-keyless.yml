name: WATT Firebase — keyless manual preview ONLY
on:
  workflow_dispatch:
    inputs:
      confirmation:
        description: 'Type PREVIEW_ONLY to deploy a new 7-day preview; never live'
        type: string
        required: true
permissions:
  contents: read
concurrency:
  group: watt-firebase-preview-protected
  cancel-in-progress: false
jobs:
  firebase-keyless-review:
    if: github.repository == 'Resonance-AppDev/watt-free-pilot' && github.repository_id == '1441700773' && github.ref == 'refs/heads/main' && github.event_name == 'workflow_dispatch' && inputs.confirmation == 'PREVIEW_ONLY'
    name: Federated identity; new Firebase Hosting preview only
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Checkout (no write credentials)
        uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Node 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify payload and source BEFORE cloud auth
        run: |
          sha256sum -c HOSTING-PAYLOAD.sha256
          python3 verify-kit.py
          npm run check
          npm run build
      - name: Fail closed unless explicitly configured
        env:
          WIF_PROVIDER: ${{ vars.WATT_WIF_PROVIDER }}
          WIF_SERVICE_ACCOUNT: ${{ vars.WATT_WIF_SERVICE_ACCOUNT }}
        run: |
          if [[ ! "$WIF_PROVIDER" =~ ^projects/[0-9]+/locations/global/workloadIdentityPools/[a-zA-Z0-9_-]+/providers/[a-zA-Z0-9_-]+$ ]]; then
            echo 'STOP: WATT_WIF_PROVIDER must name the exact reviewed Google Workload Identity Provider' >&2
            exit 2
          fi
          if [[ "$WIF_SERVICE_ACCOUNT" != *@watt-36912.iam.gserviceaccount.com ]]; then
            echo 'STOP: WATT_WIF_SERVICE_ACCOUNT must be in watt-36912' >&2
            exit 2
          fi
      - name: Exchange short-lived GitHub OIDC identity (no private JSON key)
        uses: google-github-actions/auth@v3
        with:
          project_id: watt-36912
          workload_identity_provider: ${{ vars.WATT_WIF_PROVIDER }}
          service_account: ${{ vars.WATT_WIF_SERVICE_ACCOUNT }}
          create_credentials_file: true
          export_environment_variables: true
      - name: Install Firebase CLI (runner only)
        run: npm install --global firebase-tools
      - name: Deploy fresh seven-day preview only — fail closed
        run: bash scripts/github-preview-only.sh
